<section class="page-section fade-in">
  <div class="page-header">
    <h1 class="page-title">Mis <span class="gradient-text font-outfit">Favoritos</span></h1>
    <p class="page-subtitle font-inter">Los títulos de anime que has guardado para ver más tarde.</p>
  </div>

  @if (favoriteAnimes.length === 0) {
    <!-- Empty State View -->
    <app-empty-state
      icon="🏮"
      title="Tu Templo de Favoritos está vacío"
      message="Explora las series más populares en el inicio para añadir tus producciones favoritas a esta colección persistente."
      actionLabel="Explorar Series"
      (actionClicked)="onGoToHome()"
    ></app-empty-state>
  } @else {
    <!-- Grid Collection View -->
    <div class="anime-grid grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-6">
      @for (anime of favoriteAnimes; track anime.mal_id) {
        <app-anime-card
          [anime]="anime"
          (cardClicked)="onCardClicked($event)"
        ></app-anime-card>
      }
    </div>
  }
</section>
