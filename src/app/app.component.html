<app-navbar 
  [currentRoute]="currentRoute()" 
  [favoritesCount]="favoritesCount()" 
  (navigate)="onNavigate($event)">
</app-navbar>

<main class="app-main-content">
  <div class="route-container" [class.route-exit]="routeTransitionState() === 'exit'" [class.route-enter]="routeTransitionState() === 'enter'">
    @if (currentRoute().path === 'home') {
      <app-home
        (navigateTo)="onNavigate($event)"
        (favoriteToggled)="onFavoriteToggled($event)">
      </app-home>
    } @else if (currentRoute().path === 'search') {
      <app-search
        (navigateTo)="onNavigate($event)"
        (favoriteToggled)="onFavoriteToggled($event)">
      </app-search>
    } @else if (currentRoute().path === 'details') {
      <app-details
        [animeId]="currentRoute().paramId"
        (navigateTo)="onNavigate($event)"
        (favoriteToggled)="onFavoriteToggled($event)">
      </app-details>
    } @else if (currentRoute().path === 'favorites') {
      <app-favorites
        (navigateTo)="onNavigate($event)">
      </app-favorites>
    } @else {
      <!-- Fallback / Wildcard for any other non-existent virtual route -->
      <app-not-found (goHome)="navigateTo('home')"></app-not-found>
    }
  </div>
</main>

<footer class="app-footer">
  <div class="footer-content">
    <p>&copy; 2026 OtakuNexus. Hecho con ❤️ para fans del anime.</p>
    <p class="api-attribution">Powered by Jikan API (MyAnimeList)</p>
  </div>
</footer>
