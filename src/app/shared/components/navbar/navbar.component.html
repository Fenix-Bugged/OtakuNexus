<header class="header">
  <div class="nav-container">
    <div class="logo-area" (click)="onNavigate('home')">
      <span class="logo-icon">⛩️</span>
      <span class="logo-text">OTAKU<span class="logo-highlight">NEXUS</span></span>
    </div>

    <nav class="nav-links">
      <button 
        [class.active]="currentRoute.path === 'home'" 
        (click)="onNavigate('home')" 
        class="nav-item">
        Inicio
      </button>
      <button 
        [class.active]="currentRoute.path === 'search'" 
        (click)="onNavigate('search')" 
        class="nav-item">
        Buscador
      </button>
      <button 
        [class.active]="currentRoute.path === 'favorites'" 
        (click)="onNavigate('favorites')" 
        class="nav-item favorites-button">
        Favoritos
        @if (favoritesCount > 0) {
          <span class="badge">{{ favoritesCount }}</span>
        }
      </button>
    </nav>
  </div>
</header>
